name: P3 Directed XYZ Gate

on:
  push:
    branches:
      - chatgpt/p3-xyz-motion-gate-harden-20261021
  pull_request:
    paths:
      - "scripts/simulation/p3_dynamic_mount.py"
      - "scripts/simulation/p3_motion_gate.py"
      - "tests/simulation/test_p3_motion_gate.py"
      - ".github/workflows/p3_directed_motion_gate.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax compile without Isaac imports
        run: python -m py_compile scripts/simulation/p3_dynamic_mount.py scripts/simulation/p3_motion_gate.py
      - name: Signed XYZ motion negative controls
        run: python -m unittest discover -s tests/simulation -p 'test_p3_motion_gate.py' -v
