name: D455 Provenance Witness Gate

on:
  push:
    branches:
      - chatgpt/p6-d455-witness-value-gate-20261022
  pull_request:
    paths:
      - "src/simulation/sensors/d455_metadata.py"
      - "tests/simulation/p6_d455_metadata_test.py"
      - ".github/workflows/p6_witness_value_gate.yml"

permissions:
  contents: read

jobs:
  witness-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile metadata loader
        run: python -m py_compile src/simulation/sensors/d455_metadata.py
      - name: Validate D455 metadata including forged source value
        run: python -m pytest tests/simulation/p6_d455_metadata_test.py -q
