name: Morph One CAD audit contracts

on:
  push:
    branches:
      - audit/morph-one-sandwich-review
  pull_request:
    paths:
      - 'scripts/simulation/map_step_solids_to_usd_meshes.py'
      - 'scripts/simulation/run_metric_scene_validation.py'
      - 'tests/simulation/cad/test_step_to_usd_mapping.py'
      - 'tests/simulation/cad/test_morph_one_metric_scene.py'
      - '.github/workflows/morph-one-cad-audit.yml'

jobs:
  cpu-cad-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile changed sources
        run: |
          python -m py_compile scripts/simulation/map_step_solids_to_usd_meshes.py
          python -m py_compile scripts/simulation/morph_one_metric_scene.py
          python -m py_compile scripts/simulation/run_metric_scene_validation.py
          python -m py_compile scripts/simulation/audit_archived_step_usd_mapping.py
      - name: Test matching and metric stage (pxr tests skip outside Isaac)
        run: |
          python -m pytest -q tests/simulation/cad/test_step_to_usd_mapping.py tests/simulation/cad/test_morph_one_metric_scene.py
      - name: Recompute all 224 archived pair containment results
        run: python scripts/simulation/audit_archived_step_usd_mapping.py
