#   ad-hoc       : --ckpt NAME=PATH  (wins over a registry entry with the same name)
#
# `path`  = LOCAL copy used for evaluation (results are the local SSOT).
# `remote`= where the run lives on the training host (documentation only, never read by the tool).
# A name may omit/have an empty `path` (placeholder): the evaluator prints SKIP and keeps going.
